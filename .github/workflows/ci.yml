name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          use-github-cache: "false"
      - run: python3 -m unittest discover -v
      - run: lake exe lake-compat 4.36.0 --demo --verify
