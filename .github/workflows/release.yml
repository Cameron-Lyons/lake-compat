name: Native release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  package:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
            architecture: x86_64
          - runner: macos-15
            platform: macos-arm64
            architecture: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - name: Build the versioned release archive
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCHITECTURE: ${{ matrix.architecture }}
          MACOSX_DEPLOYMENT_TARGET: '15.0'
        run: |
          version=$(cat VERSION)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          test "$(uname -m)" = "$ARCHITECTURE"
          archive=$(lake exe package-release "${RUNNER_TEMP}/package")
          mkdir -p release
          mv -- "$archive" "release/lake-compat-$version-$PLATFORM.tar.gz"
          lake build release-smoke
          cp .lake/build/bin/release-smoke "release/release-smoke-$PLATFORM"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  smoke:
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: macos-15
            platform: macos-arm64
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-${{ matrix.platform }}
      - name: Run the downloaded archive without Lean
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          archives=(lake-compat-*-"$PLATFORM".tar.gz)
          test "${#archives[@]}" -eq 1
          version=${archives[0]#lake-compat-}
          version=${version%-"$PLATFORM".tar.gz}
          chmod +x "release-smoke-$PLATFORM"
          "./release-smoke-$PLATFORM" "${archives[0]}" "$version"

  compatibility:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
        with:
          auto-config: 'false'
          use-github-cache: 'false'
          use-mathlib-cache: 'false'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: native-linux-x86_64
          path: release
      - name: Check public projects and Git-based installation
        run: |
          elan toolchain install leanprover/lean4:v4.34.1
          tar -xzf "release/lake-compat-$(cat VERSION)-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          revision=$GITHUB_SHA
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            revision=$GITHUB_REF_NAME
          fi
          lake exe release-compat "$RUNNER_TEMP/lake-compat" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$revision"

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [ci, smoke, compatibility]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: native-*
          merge-multiple: true
      - name: Publish the tested archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          archives=("lake-compat-$version-linux-x86_64.tar.gz" "lake-compat-$version-macos-arm64.tar.gz")
          sha256sum "${archives[@]}" > SHA256SUMS
          options=()
          if [[ "$version" == *-* ]]; then
            options+=(--prerelease)
          fi
          cat > release-notes.md <<'NOTES'
          Download the native archive for Ubuntu 24.04 x86-64 or macOS 15 on Apple silicon.
          Verify it against `SHA256SUMS`, extract it, and run `./lake-compat 4.36.0 --demo`.

          If you used the Python wheel or `.pyz` in v0.1.0, switch to the native executable.
          JSON reports now identify their format with `schema_version`.
          NOTES
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "lake-compat $version" --notes-file release-notes.md --generate-notes \
            "${options[@]}" "${archives[@]}" SHA256SUMS
