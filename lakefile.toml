name = "lake-compat"
version = "1.0.0"
description = "Explain and test dependency upgrades in Lean 4 projects"
keywords = ["lake", "dependencies", "toolchain", "upgrades"]
license = "Apache-2.0"
defaultTargets = ["lake-compat"]
testDriver = "«lake-compat-tests»"

[[input_file]]
name = "releaseLicense"
path = "LICENSE"

[[input_file]]
name = "releaseVersion"
path = "VERSION"
text = true

[[input_file]]
name = "workspaceInspector"
path = "scripts/inspect-workspace.lean"
text = true

[[input_file]]
name = "reportSchema"
path = "schema/report-v1.json"
text = true

[[input_file]]
name = "buildToolchain"
path = "lean-toolchain"
text = true

[[input_dir]]
name = "demoSources"
path = "examples/upgrade-demo"
text = true
filter = { fileName = ["Main.lean", "Greeting.lean", "lakefile.toml", "lake-manifest.json", "lean-toolchain"] }

[[lean_lib]]
name = "LakeCompat"
needs = ["demoSources", "releaseVersion", "workspaceInspector"]

[[lean_lib]]
name = "LeanTests"
globs = ["LeanTests.+"]
needs = ["reportSchema"]

[[lean_lib]]
name = "Tools"
globs = ["Tools.+"]
needs = ["buildToolchain"]

[[lean_exe]]
name = "lake-compat"
root = "LakeCompatMain"
# These executables run Lake in a child process and need no Lean elaborator.
moreLinkArgs = ["-linitialize_minimal"]

[[lean_exe]]
name = "lake-compat-tests"
root = "LeanTests.Main"
needs = ["lake-compat", "package-release", "benchmark-scans", "release-smoke"]
moreLinkArgs = ["-linitialize_minimal"]

[[lean_exe]]
name = "package-release"
root = "PackageRelease"
moreLinkArgs = ["-linitialize_minimal"]

[[lean_exe]]
name = "benchmark-scans"
root = "Tools.BenchmarkScans"
needs = ["lake-compat"]
moreLinkArgs = ["-linitialize_minimal"]

[[lean_exe]]
name = "check-report-schema"
root = "Tools.CheckReportSchema"
needs = ["lake-compat", "lake-compat-tests"]
moreLinkArgs = ["-linitialize_minimal"]

[[lean_exe]]
name = "release-compat"
root = "Tools.ReleaseCompat"
moreLinkArgs = ["-linitialize_minimal"]

[[lean_exe]]
name = "release-smoke"
root = "Tools.ReleaseSmoke"
moreLinkArgs = ["-linitialize_minimal"]
